[package]
name = "marray"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Pure-Rust scientific computing and machine learning library with Pythonic NumPy, SciPy, and scikit APIs"
repository = "https://github.com/keejkrej/marray-rs"
documentation = "https://docs.rs/marray"
keywords = ["numpy", "scipy", "scikit-learn", "scikit-image", "machine-learning"]
categories = ["science", "mathematics", "algorithms"]
include = [
    "/src/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/tests/**/*",
    "/examples/**/*",
]

[dependencies]
ndarray = { version = "0.16.1", features = ["serde"] }
num-traits = "0.2.19"
rand = "0.8.5"
rand_distr = "0.4.3"
nalgebra = { version = "0.33.0" }
rustfft = "6.2.0"
special = "0.13"
image = { version = "0.25.1", optional = true }
imageproc = { version = "0.25.0", optional = true }

[features]
default = ["np", "sp", "sklearn", "skimage", "numpy_ml"]
np = []
sp = []
sklearn = []
skimage = ["dep:image", "dep:imageproc"]
numpy_ml = []

[dev-dependencies]
serde_json = "1.0"
